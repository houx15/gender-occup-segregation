# WEAT analysis on our from-scratch trained COHA SGNS embeddings.
# Companion to coha_garg.yml — same models_dir, different metric.
#
# Wordlists live in wordlists/en/weat_formal/ (3 attribute dimensions:
# work-vs-family, leadership-vs-non-leadership, stem-vs-non-stem). Gender
# words are the union of our original WEAT list + Garg's 20-pair list.
#
# Run:
#   python -m scripts.analyze_weat --config=config/profiles/weat_coha_trained.yml
language: "en"
data_source: "coha"
analysis_mode: "weat"

paths:
  base_dir: "/scratch/network/yh6580/gender-occup"
  raw_coha_dir: "/scratch/network/yh6580/gender-occup/data/raw_coha"
  coha_decompressed_dir: "/scratch/network/yh6580/gender-occup/data/raw_coha_decompressed"
  corpora_dir: "/scratch/network/yh6580/gender-occup/data/corpora_en_coha"
  # Reuses the models trained for the Garg replication.
  models_dir: "/scratch/network/yh6580/gender-occup/data/models_en_coha_garg"
  # Distinct results_dir so WEAT outputs don't collide with Garg's parquet files.
  results_dir: "/scratch/network/yh6580/gender-occup/data/results_weat_trained_coha"
  log_dir: "/scratch/network/yh6580/gender-occup/logs"
  figures_dir: "/scratch/network/yh6580/gender-occup/figures_weat_trained_coha"

# Top-level coha block is required by config_loader's validator whenever
# data_source=coha AND embedding.format is not a pretrained shortcut.
# WEAT itself never reads this; we're reusing models already on disk.
coha:
  format: fulltext
  min_chunk_tokens: 5
  source_archive_urls: []

embedding:
  vector_size: 300
  window: 4
  min_count: 100
  sg: 1
  negative: 15
  workers: 16
  epochs: 5
  seed: 42
  model_name_template: "coha_{unit_name}.model"

corpus:
  min_words: 2
  tokenizer: "whitespace"
  lowercase: true

wordlists:
  dir: "wordlists/en/weat_formal"
  weat_gender_file: "gender_words.json"
  weat_domestic_work_file: "domestic_work_words.json"
  weat_leadership_file: "leadership_words.json"
  weat_stem_file: "stem_words.json"

embedding_source: "trained_coha"

analysis:
  occupation_strategy: "whole_token"
  min_coverage: 0.5
