data_source: "newspaper"
analysis_mode: "weat"

paths:
  base_dir: "/lustre/home/2401111059/gender-occup-segregation"
  raw_data_dir: "/lustre/home/2401111059/gender-occup-segregation/data/raw_newspaper"
  corpora_dir: "/lustre/home/2401111059/gender-occup-segregation/data/corpora"
  models_dir: "/lustre/home/2401111059/gender-occup-segregation/data/models"
  results_dir: "/lustre/home/2401111059/gender-occup-segregation/data/results"
  log_dir: "/lustre/home/2401111059/gender-occup-segregation/logs"
  figures_dir: "/lustre/home/2401111059/gender-occup-segregation/figures"

wordlists:
  dir: "wordlists/weat_formal"
  weat_gender_file: "gender_words.json"
  weat_domestic_work_file: "domestic_work_words.json"
  weat_leadership_file: "leadership_words.json"
  weat_stem_file: "stem_words.json"

provincial:
  province_groups:
    - ["北京", "天津", "河北", "山西"]
    - ["内蒙古", "辽宁", "吉林", "黑龙江"]
    - ["上海", "江苏"]
    - ["福建", "江西", "山东"]
    - ["河南", "湖北", "湖南"]
    - ["广西", "海南"]
    - ["重庆", "四川", "贵州", "云南"]
    - ["西藏", "陕西", "甘肃", "青海", "宁夏", "新疆"]
    - ["浙江", "安徽"]
    - ["广东"]
  min_documents: 1000
  newspaper_mapping_file: "provincial/data/newspaper_province_mapping.json"

embedding:
  vector_size: 300
  window: 5
  min_count: 20
  sg: 1
  negative: 10
  workers: 8
  epochs: 10
  seed: 42
  model_name_template: "model_{unit_name}.kv"

corpus:
  tokenizer: "jieba"
  min_words: 5
