language: "zh"
data_source: "ngram"
analysis_mode: "prestige"

paths:
  base_dir: "/scratch/network/yh6580/gender-occup"
  raw_ngram_dir: "/scratch/network/yh6580/gender-occup/raw_ngrams"
  decompressed_dir: "/scratch/network/yh6580/gender-occup/raw_ngrams_decompressed"
  corpora_dir: "/scratch/network/yh6580/gender-occup/corpora"
  models_dir: "/scratch/network/yh6580/gender-occup/models"
  results_dir: "/scratch/network/yh6580/gender-occup/results"
  log_dir: "/scratch/network/yh6580/gender-occup/logs"
  figures_dir: "/scratch/network/yh6580/gender-occup/figures"

wordlists:
  dir: "wordlists/zh/prestige"
  occupations_file: "occupations.txt"
  gender_words_file: "gender_words.json"
  prestige_axes_file: "prestige_axes.json"

ngram:
  language: "chi_sim"
  n: 5
  min_year: 1940
  max_year: 2020

time_slices:
  window_size: 10
  step_size: 5
  start_year: 1940
  end_year: 2020

embedding:
  vector_size: 300
  window: 4
  min_count: 50
  sg: 1
  negative: 15
  workers: 16
  epochs: 5
  seed: 42
  model_name_template: "chi_sim_5gram_{slice_name}.model"

corpus:
  use_counts: false
  min_count_threshold: 1
  tokenizer: "whitespace"
