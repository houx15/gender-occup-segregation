# IPUMS USA ACS extract for family-side survey measures by state-period
# (scripts/data_prep/download_ipums_acs.py; network step on the login node).
# Adults 25-54 (prime working / parenting ages), all employment statuses.
#   NCHLT5 / NCHILD   own children under 5 / any own children in the household
#   MARST             marital status;  LABFORCE / EMPSTAT  labor force, employment
#   UHRSWORK          usual hours worked per week
#   INCWAGE (+ spouse) wage income of the person and, attached, of the spouse
#                      (INCWAGE_SP) -> wife's share of couple earnings
description: "gender-occup family: adults 25-54, children, marital, employment, hours, own + spouse wages, ACS 2005-2024"
out_dir: "/scratch/network/yh6580/gender-occup/data/ipums_acs_family"
years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014,
        2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
variables: [YEAR, STATEFIP, SEX, AGE, MARST, NCHILD, NCHLT5, LABFORCE, EMPSTAT, UHRSWORK, INCWAGE, PERWT]
case_selections:
  AGE: ["025", "026", "027", "028", "029", "030", "031", "032", "033", "034", "035", "036", "037", "038", "039", "040", "041", "042", "043", "044", "045", "046", "047", "048", "049", "050", "051", "052", "053", "054"]
attached:
  INCWAGE: [spouse]
