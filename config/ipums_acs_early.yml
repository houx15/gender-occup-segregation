# Survey data for the early text windows (1995-2004, 2000-2009): 2000 decennial
# census 5% sample + ACS 2001-2004, same variables and selection as
# config/ipums_acs.yml. Downloaded into a sub-folder of the main extract's
# out_dir; build_occupation_shares reads every extract under out_dir.
description: "gender-occup: employed persons, OCC2010 x SEX x STATEFIP, Census 2000 5% + ACS 2001-2004"
out_dir: "/scratch/network/yh6580/gender-occup/data/ipums_acs/early_2000_2004"
years: []
samples: [us2000a, us2001a, us2002a, us2003a, us2004a]
variables: [YEAR, STATEFIP, SEX, AGE, EMPSTAT, OCC2010, PERWT]
case_selections:
  EMPSTAT: ["1"]   # employed
