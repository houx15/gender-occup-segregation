# IPUMS ATUS extract for the housework / care split by state-window
# (scripts/data_prep/download_ipums_acs.py; network step on the login node).
# One row per ATUS respondent (diary day); time-use variables are minutes that day.
#   BLS_HHACT          household activities (all)      BLS_HHACT_HWORK  housework
#   BLS_HHACT_FOOD     food preparation and cleanup    BLS_CAREHH       caring for household members
#   BLS_CAREHH_KID     caring for household children
#   WT06 / WT20        final person weights (WT20 for 2020+ per BLS guidance)
#   SPOUSEPRES / HH_CHILD   spouse/partner present; own child under 18 in household
collection: "atus"
sample_template: "at{year}"
description: "gender-occup ATUS: housework and care minutes by sex and state, 2005-2024"
out_dir: "/scratch/network/yh6580/gender-occup/data/ipums_atus"
years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014,
        2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
variables: [YEAR, STATEFIP, SEX, AGE, SPOUSEPRES, HH_CHILD, WT06, WT20]
case_selections: {}
time_use_variables: [BLS_HHACT, BLS_HHACT_HWORK, BLS_HHACT_FOOD, BLS_CAREHH, BLS_CAREHH_KID]
sample_members:
  includeNonRespondents: false
  includeHouseholdMembers: false
